name: Extraire les figures techniques des projets GEII
on:
  push:
    branches: [migration-google-takeout-2026]
    paths:
      - scripts/import_project_figures.py
      - scripts/project_figure_plan.json
      - .github/workflows/import-project-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils PDF
        run: python -m pip install --quiet gdown pymupdf pillow
      - name: Générer les captures authentiques depuis les documents des projets
        run: python scripts/import_project_figures.py
      - name: Enregistrer les images et le manifeste validé
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/studies src/projectTechnicalEvidence.json scripts/project_figure_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Intégrer les captures des rapports et schémas des projets GEII"
            for attempt in 1 2 3 4 5; do
              git fetch origin migration-google-takeout-2026
              git rebase origin/migration-google-takeout-2026
              if git push origin HEAD:migration-google-takeout-2026; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
