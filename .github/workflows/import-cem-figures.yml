name: Extraire les figures CEM filtre accordé et PFC
on:
  push:
    branches: [migration-google-takeout-2026]
    paths:
      - scripts/import_cem_figures.py
      - .github/workflows/import-cem-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils d'extraction des figures
        run: python -m pip install --quiet pymupdf pillow
      - name: Capturer les sept schémas et oscillogrammes du TP CEM
        run: python scripts/import_cem_figures.py
      - name: Enregistrer les captures PSIM authentiques
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cem/filtre-accorde-*.webp public/assets/cem/pfc-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Ajouter les simulations PSIM du filtre LC et du PFC [skip ci]"
            git push origin HEAD:migration-google-takeout-2026
          fi
